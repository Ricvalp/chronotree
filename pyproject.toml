[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "chronotree"
version = "0.1.0"
description = "Causal space-time memory readers for RoboMME"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch==2.9.1",
  "numpy==1.26.4",
  "h5py==3.14.0",
  "PyYAML==6.0.2",
  "huggingface-hub==0.35.3",
  "matplotlib==3.10.7",
  "imageio==2.37.0",
  "imageio-ffmpeg==0.6.0",
  "safetensors==0.6.2",
  "wandb==0.23.0",
]

[project.optional-dependencies]
simulator = ["robomme", "mani-skill", "torchvision==0.24.1", "opencv-python==4.11.0.86", "setuptools==80.9.0"]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/stmem"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
robomme = { git = "https://github.com/RoboMME/robomme_benchmark.git", rev = "6503b26e00ff338611fceb039417fbc64826ccc8" }
mani-skill = { git = "https://github.com/YinpeiDai/ManiSkill.git", rev = "07be6fbc66350ddca200abfb0a11b692f078f7fd" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 110

