extends: teacher_b200_b128_m8_blocks32_no_previous_joint_commands_h32.yaml
# Matched frozen-vision control: measured state retained, ALL previous commands
# (joints, gripper and availability) removed. Train freshly, not from old runs.
model:
  proprioception_mode: all
  condition_on_previous_commands: false
  visual_features:
    mode: clip_rn50_layer1
    backbone: openai_clip_rn50
    layer: layer1
    preprocessing: clip_rgb_native256_v1
    projection_dim: 128
    checkpoint: '{cache_root}/backbones/clip_RN50.pt'
    checkpoint_sha256: afeb0e10f9e5a86da6080e35cf09123aca3b358a0c3e3b6c78a7b63bc04b6762
    cache_dir: '{data_root}/features_clip_rn50_layer1_v1'
training:
  steps: 100000
  effective_batch: 128
  microbatch: 8
  encoder_block_batch_size: 32
  lr: 0.0001
  checkpoint_steps: [25000, 50000, 100000]
